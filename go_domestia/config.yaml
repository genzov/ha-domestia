name: Domestia Bridge
slug: go_domestia
version: "1.4.1"
description: Bridges a Domestia lighting controller to Home Assistant over MQTT
url: https://github.com/genzov/go-domestia
stage: deprecated
startup: application
boot: auto
arch:
  - armv7
  - aarch64
  - amd64
image: "ghcr.io/genzov/go-domestia-{arch}"
init: false
options:
  ip_address: ""
  refresh_frequency: 2000
  mqtt:
    ip_address: core-mosquitto
    username: ""
    password: ""
  lights: []
schema:
  ip_address: str
  model: list(DMC-012-003|DMC-008-001)?
  refresh_frequency: int(250,)?
  mqtt:
    ip_address: str
    username: str
    password: password
  lights:
    - name: str
      relay: int
      dimmable: bool?
      always_on: bool?
