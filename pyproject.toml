[project]
name = "ha-domestia"
version = "0.1.0"
description = "Home Assistant custom integration for Domestia lighting controllers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
# Runtime requirements belong in custom_components/domestia/manifest.json.
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff",
]

[tool.uv]
# Home Assistant loads the integration from custom_components/; it is not a wheel.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/domestia"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/domestia"]
explicit_package_bases = true
mypy_path = "."

[tool.ruff]
target-version = "py314"
# Code blocks in Markdown are illustrative contracts and snippets, not modules.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Home Assistant's entity signatures use **kwargs: Any
    "COM812",  # conflicts with the formatter
    "CPY001",  # no per-file copyright headers; see LICENSE
    "TC001",   # Home Assistant convention: plain imports for annotations
    "TC002",
    "TC003",
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "EM101",   # exception messages as literals are fine
    "EM102",
    "TRY003",  # long messages outside exception classes are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic values are the point of table tests
    "S101",    # assert
    "SLF001",  # tests may reach into private members
]
