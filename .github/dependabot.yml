version: 2
updates:
  # Python dev dependencies in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    # Wait out freshly published releases. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      dev-tools:
        patterns: ["*"]
        # Each gets its own pull request:
        # - pytest-homeassistant pins a Home Assistant release, so bump it
        #   together with the HA target (see AGENTS.md).
        # - ruff runs with select = ["ALL"], so new rules can fail lint.
        exclude-patterns: ["pytest-homeassistant", "ruff"]

  # Actions pinned by commit SHA in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
