name: Release

# Releases whenever the integration version in manifest.json changes on main:
# runs the integration checks, then tags and publishes a GitHub release with the
# matching CHANGELOG section. The Home Assistant Marketplace offers the update
# from the latest GitHub release.

on:
  push:
    branches: [main]
    paths: [custom_components/domestia/manifest.json]
  workflow_dispatch:

# Jobs request what they need; the default is read-only
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can stop a release runs before anything is published
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(jq -er .version custom_components/domestia/manifest.json) || {
            echo "::error::No version found in custom_components/domestia/manifest.json"
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "Release $version already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release notes
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/release-notes.sh "$VERSION"

  checks:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    uses: ./.github/workflows/integration.yml

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --latest
